name: Build Aubess only

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Board name from device_db.yaml to build"
        type: string
        default: PLUG___AUBESS_PM_TS011F
        required: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0  

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make python3 yq unzip wget gcc-arm-none-eabi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Cache Silicon Labs Tools
      uses: actions/cache@v3
      with:
        path: silabs_tools
        key: silabs-tools-2025.6.2

    - name: Cache Telink Tools
      uses: actions/cache@v3
      with:
        path: telink_tools
        key: telink-tools-v3.7.2.0

    - name: Cache Python Virtual Environment
      uses: actions/cache@v3
      with:
        path: .venv
        key: python-venv-${{ hashFiles('requirements.txt') }}

    - name: Install SDK and Toolchain
      run: |
        make setup || (
          echo "dumping log:" &&
          cat /home/runner/work/tuya-zigbee-switch/tuya-zigbee-switch/silabs_tools/slc-cli/bin/slc-cli/configuration/*.log
        )

    - name: Clear out index files
      run: |
        source .venv/bin/activate
        make tools/clean_z2m_index 

    - name: Build single board
      run: |
        source .venv/bin/activate
        BOARD="${{ inputs.board }}"
        TYPE=$(yq -r --arg b "$BOARD" 'to_entries[] | select(.key==$b) | .value.device_type' device_db.yaml)
        if [ -z "$TYPE" ] || [ "$TYPE" = "null" ]; then
          echo "ERROR: board '$BOARD' not found in device_db.yaml (or it has no device_type)."
          exit 1
        fi

        echo "Building for board: $BOARD (router)"
        BOARD="$BOARD" DEVICE_TYPE=router make board/build || exit 1
        echo "Checking if files were created for board: $BOARD (router)"
        ls -l bin/router/$BOARD/

        if [ "$TYPE" = "end_device" ]; then
          echo "Building for board: $BOARD (end_device)"
          BOARD="$BOARD" DEVICE_TYPE=end_device make board/build || exit 1
          echo "Checking if files were created for board: $BOARD (end_device)"
          ls -l bin/end_device/${BOARD}_END_DEVICE/
        fi

    - name: Update Z2M converters
      run: |
        source .venv/bin/activate
        make tools/update_converters

    - name: Update ZHA quirks
      run: |
        source .venv/bin/activate
        make tools/update_zha_quirk

    - name: Update HOMEd extensions
      run: |
        source .venv/bin/activate
        make tools/update_homed_extension

    - name: Update supported_devices.md
      run: |
        source .venv/bin/activate
        make tools/update_supported_devices

    - name: Commit changes
      run: |
        source .venv/bin/activate
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add bin/* zigbee2mqtt/* zha/* homed/* docs/supported_devices.md
        git diff --cached --quiet || git commit -m "Update firmware files, converters, quirks, extensions and supported devices list"
        make tools/freeze_ota_links
        git add zigbee2mqtt/*
        git diff --cached --quiet || git commit -m "Freeze links in OTA index files"
        git push
